name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci_test_secret_that_is_long_enough_0123456789
      DB_PATH: ./ci-database.sqlite
      PORT: 5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Fresh database with seed data
        run: |
          npm run migrate
          npm run seed
      - name: Start server
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5001/api/health && break; sleep 1; done
      - name: Feature and security tests
        env:
          TEST_BASE: http://localhost:5001/api
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build
